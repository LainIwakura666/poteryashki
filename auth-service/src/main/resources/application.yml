server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC


jwt:
  secret: ${JWT_SECRET}
  access-ttl: PT15M
  issuer: pet-service

logging:
  level:
    org.springframework.security: INFO
    org.yasha.auth: DEBUG