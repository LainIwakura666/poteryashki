spring:
  application:
    name: pet-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pet_service_db}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: debug
    org.yasha.petservice: debug