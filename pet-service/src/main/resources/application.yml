server:
  port: 8081

spring:
  application:
    name: pet-service

  datasource:
    url: ${PET_DB_URL:jdbc:postgresql://localhost:5432/pet_service_db}
    username: ${PET_DB_USER:myuser}
    password: ${PET_DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: debug
    org.yasha.petservice: debug