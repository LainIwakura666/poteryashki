services:
  postgres-pet-service:
    image: postgis/postgis:17-3.5-alpine
    container_name: postgres_pet_service
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: pet_service_db
    ports:
      - "5432:5432"
    volumes:
      - ./pet-service/src/main/resources/db/v1_init_pet_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata_pet_service:/var/lib/postgresql/data

volumes:
  pgdata_pet_service: